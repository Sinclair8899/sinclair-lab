name = "sinclair-lab"
main = "worker/index.js"
compatibility_date = "2026-08-06"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "lab.sinclairhuang.org"
custom_domain = true

# Workers AI (open models hosted by Cloudflare). Free plan includes a daily allocation.
[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
AI_DAILY_CAP = "300"
AI_PER_VISITOR_10MIN = "5"

# Usage statistics (D1 database "lab-stats"); tables are created automatically on first use.
[[d1_databases]]
binding = "DB"
database_name = "lab-stats"
database_id = "c499ee8e-1de7-4dcd-a4d6-6999da06d131"
