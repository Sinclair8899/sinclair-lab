name = "sinclair-lab"
main = "worker/index.js"
compatibility_date = "2026-08-06"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "lab.sinclairhuang.org"
custom_domain = true

# Workers AI (open models hosted by Cloudflare). Free plan includes a daily allocation.
[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_DAILY_CAP = "300"
AI_PER_VISITOR_10MIN = "5"

# Usage statistics (D1). Create a database named "lab-stats" in the Cloudflare
# dashboard (Storage & Databases → D1), paste its ID below, then remove the "#".
# [[d1_databases]]
# binding = "DB"
# database_name = "lab-stats"
# database_id = "PASTE-DATABASE-ID-HERE"
